[package]
name = "tree-sitter-foobar"
description = "Grammar for example language Foobar"
version = "0.1.0"
authors = ["tfachmann <tfachmann@proton.me>"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "foobar"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/tfachmann/tree-sitter-foobar"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "/grammar.js",
  "queries/*",
  "src/*",
  "/tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"
serde_json = "1"

[dev-dependencies]
tree-sitter = "0.26.9"
